<style>
/* Layout: banda scura unica, a sinistra scegli e copi, a destra la scheda viva. */
:root {
  --bg: #05070f; --panel: #0d1222; --fg: #e8edff; --muted: #8a97c0;
  --line: rgba(120,160,255,.16); --amber: #fbbf24; --cyan: #22d3ee;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; display: flex; flex-direction: column; gap: 28px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
.brand b { color: var(--amber); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: 600 13px var(--sans); color: var(--muted); background: none; border: 0; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--amber); color: #05070f; }
.lang button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.hero { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5.4vw, 52px); line-height: 1.02; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero p { color: var(--muted); font-size: 17px; margin: 0; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
.facts li { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--fg); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.tool { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.step { display: flex; flex-direction: column; gap: 8px; }
.step label, .step .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.step label span, .step .lbl span { color: var(--amber); margin-right: 6px; font-family: var(--mono); }
input[type=search] { font: 16px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; box-sizing: border-box; }
.hint { font-size: 13px; color: var(--muted); margin: 0; min-height: 1.4em; }
.hint.bad { color: #ff8fa0; }
textarea { font: 12.5px/1.5 var(--mono); color: #cfe3ff; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; box-sizing: border-box; min-height: 150px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { font: 700 14px var(--sans); background: var(--amber); color: #05070f; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
.btn:hover { background: #fcd34d; }
.ok { font-size: 13px; color: #34d399; }
.preview { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage { background: repeating-linear-gradient(135deg, rgba(120,160,255,.05) 0 10px, transparent 10px 20px); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; display: flex; justify-content: center; }
.why { border-top: 1px solid var(--line); padding-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 720px) { .why { grid-template-columns: minmax(0, 1fr); } }
.why h3 { font-family: var(--display); font-size: 17px; margin: 0 0 4px; letter-spacing: -.01em; }
.why p { margin: 0; color: var(--muted); font-size: 14px; }
.foot { font-size: 12px; color: var(--muted); }
.foot a { color: var(--fg); }
/* Scheda: la ricevuta del comune. Colori del sito (notte + ambra), un solo aspetto voluto. */
.cc-card {
  --cc-bg: #0a0e1c; --cc-bg2: #12182c; --cc-fg: #e8edff; --cc-muted: #8a97c0;
  --cc-line: rgba(120,160,255,.18); --cc-amber: #fbbf24; --cc-cyan: #22d3ee;
  --cc-num: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --cc-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box; color-scheme: dark;
  background: linear-gradient(180deg, var(--cc-bg2), var(--cc-bg));
  color: var(--cc-fg); font-family: var(--cc-sans);
  border: 1px solid var(--cc-line); border-radius: 14px;
  padding: 18px 20px 14px; max-width: 560px; width: 100%;
  display: flex; flex-direction: column; gap: 12px;
}
.cc-card * { box-sizing: border-box; margin: 0; }
.cc-kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--cc-muted); }
.cc-head { font-size: 22px; line-height: 1.15; font-weight: 750; letter-spacing: -.01em; text-wrap: balance; color: var(--cc-fg); }
.cc-rows { display: flex; flex-direction: column; border-top: 1px dashed var(--cc-line); }
.cc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--cc-line); }
.cc-row dt { font-size: 14px; color: var(--cc-muted); min-width: 0; }
.cc-row dd { font-family: var(--cc-num); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 650; white-space: nowrap; color: var(--cc-fg); }
.cc-row dd small { font-size: 12px; color: var(--cc-muted); font-weight: 500; margin-left: 2px; }
.cc-main dd { font-size: 24px; color: var(--cc-amber); }
.cc-main dt { color: var(--cc-fg); font-weight: 600; }
.cc-cta { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; background: var(--cc-amber); color: #05070f; font-weight: 700; font-size: 14px; text-decoration: none; padding: 9px 14px; border-radius: 8px; }
.cc-cta:hover { background: #fcd34d; }
.cc-cta:focus-visible, .cc-src a:focus-visible { outline: 2px solid var(--cc-cyan); outline-offset: 2px; }
.cc-src { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--cc-muted); }
.cc-src a { color: var(--cc-fg); text-decoration: none; font-size: 13px; letter-spacing: -.01em; }
.cc-src a b { color: var(--cc-amber); font-weight: 800; }
.cc-missing { font-size: 14px; color: var(--cc-muted); }
@media (max-width: 360px) { .cc-card { padding: 14px; } .cc-main dd { font-size: 20px; } .cc-head { font-size: 19px; } }

</style>

var lang = 'it', current = 'it/prato';
var byLabel = {};
var keys = Object.keys(CC_DATA).sort(function (a, b) { return CC_DATA[a][0].localeCompare(CC_DATA[b][0]); });
function label(k) { return CC_DATA[k][0] + (k.slice(0, 2) === 'it' ? ' (IT)' : ' (ES)'); }
var dl = document.getElementById('towns');
keys.forEach(function (k) { byLabel[label(k).toLowerCase()] = k; var o = document.createElement('option'); o.value = label(k); dl.appendChild(o); });
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
function find(q) {
  var v = q.toLowerCase().trim(); if (byLabel[v]) return byLabel[v];
  var n = norm(q.replace(/\((it|es)\)$/i, '')); if (!n) return null;
  var exact = keys.filter(function (k) { return norm(CC_DATA[k][0]) === n; });
  if (exact.length) return exact[0];
  var pre = keys.filter(function (k) { return norm(CC_DATA[k][0]).indexOf(n) === 0; });
  return pre.length === 1 ? pre[0] : null;
}
function snippet(k) {
  return '<!-- Cuentas Claras · ' + CC_DATA[k][0] + ' -->\n' + ccInline(k, CC_DATA);
}
function render() {
  var t = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = t[el.getAttribute('data-t')]; });
  document.getElementById('q').placeholder = t.ph;
  ['it', 'es'].forEach(function (l) { document.getElementById('l-' + l).setAttribute('aria-pressed', l === lang); });
  show(current, true);
}
function show(k, quiet) {
  var t = UI[lang], hint = document.getElementById('hint');
  if (!k) { hint.textContent = t.none; hint.className = 'hint bad'; return; }
  current = k; hint.className = 'hint'; hint.textContent = t.found(CC_DATA[k][0], k.slice(0, 2));
  document.getElementById('stage').innerHTML = ccInline(k, CC_DATA);
  document.getElementById('code').value = snippet(k);
  if (!quiet) document.getElementById('ok').textContent = '';
}
document.getElementById('q').addEventListener('input', function (e) { var k = find(e.target.value); if (k) show(k); else if (e.target.value.trim().length > 2) show(null); });
document.querySelectorAll('.lang button').forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-l'); if (current.slice(0, 2) !== lang) current = lang === 'it' ? 'it/prato' : 'es/teruel'; render(); }); });
document.getElementById('copy').addEventListener('click', function () {
  var ta = document.getElementById('code'), ok = document.getElementById('ok'), t = UI[lang];
  var done = function () { ok.textContent = t.copied; };
  var fail = function () { ta.focus(); ta.select(); ok.textContent = t.copyFail; };
  try { navigator.clipboard.writeText(ta.value).then(done, fail); } catch (e) { fail(); }
});
render();
